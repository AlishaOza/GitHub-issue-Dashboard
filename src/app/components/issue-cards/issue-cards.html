<!-- Issues List Component -->
 <cdk-virtual-scroll-viewport
  itemSize="250"
  class="h-[135vh] hide-scrollbar"
>
<div class="w-full bg-slate-950 p-4">
  <div *ngIf="isloading">

  <h1 class="text-white text-2xl" *ngIf="!isValiad && !isEmpty && !iserror">
    Loading Issues...
  </h1>
</div>
  <div *ngIf="iserror">
    <h1 class="text-white text-2xl">
    No Repository Found...
  </h1>

  </div>
  <div *ngIf="isEmpty">
<h1 class="text-white text-2xl">
    No Issue Found...
  </h1>
  </div>

<div *ngIf="isValiad">

  <h1 class="text-red-500 text-xl font-semibold">

    Enter repo in format:
    owner/repository

  </h1>

</div>

  <div class="bg-slate-900/80 border border-slate-800 rounded-2xl overflow-hidden" *ngIf="!isloading">

   

    <!-- Issue Card -->
    <div class="flex items-start justify-between gap-6 p-6 border-b border-slate-800 hover:bg-slate-900 transition"    *cdkVirtualFor="let item of filterData " (click)="Opencard(item)">

      <!-- Left Content -->
      <div class="flex gap-5">

        <img
          [src]="item.user.avatar_url"
          alt=""
          class="w-14 h-14 rounded-full object-cover border border-slate-700"
        />

        <div>

          <p class="text-slate-500 font-medium mb-1">
           #{{item.number}}
          </p>

          <h2 class="text-2xl font-semibold text-white mb-2">
            {{item.title}}
          </h2>

          <div class="flex items-center gap-2 text-slate-400 text-sm mb-4">

            <span>Opened by</span>

            <span class="text-blue-400 font-medium">
             {{item.user.login}}
            </span>

            <span>•</span>

            <span>{{item.created_at | countDays }}</span>
          </div>

          <div class="flex items-center gap-3 mb-4" >

  <span
    *ngFor="let label of item.labels || []"
    class="text-white text-xs px-3 py-1 rounded-full"
    [style.backgroundColor]="'#' + label.color"
    [style.color]="label.color === 'e7e7e7' ? 'black' : 'white'"
  >
    {{ label.name }}
  </span>

            
          </div>

          <div class="flex items-center gap-2 text-slate-400 text-sm">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.5"
                 stroke="currentColor"
                 class="w-5 h-5">

              <path stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M2.25 12.76c0 1.6 1.123 2.994 2.64 3.227.351.054.705.082 1.06.082 1.19 0 2.323-.311 3.303-.87l3.053 1.017a.75.75 0 00.95-.95l-1.017-3.053a6.722 6.722 0 00.87-3.303c0-.355-.028-.709-.082-1.06-.233-1.517-1.627-2.64-3.227-2.64H8.25c-3.314 0-6 2.686-6 6z" />
            </svg>

            <span>{{item.comments}} comments</span>
          </div>

        </div>
      </div>

      <!-- Right -->
      <div class="flex flex-col items-end justify-between h-full gap-16" >

         <span class="bg-green-500 text-white text-sm font-semibold px-5 py-2 rounded-full" *ngIf="item.state=='open'">
        OPEN
      </span>
        <span class="bg-red-500 text-white text-sm font-semibold px-5 py-2 rounded-full" *ngIf="item.state=='closed'">
          CLOSED
        </span>

        <p class="text-slate-400 text-sm">
          Updated {{item.updated_at |countDays}}
        </p>

      </div>
    </div>


  </div>
 
    </div>
    </cdk-virtual-scroll-viewport>
