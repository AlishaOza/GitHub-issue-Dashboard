<div class="w-full bg-slate-950 p-4">

  <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-2xl px-5 py-4 shadow-lg">

    <!-- Left Filters -->
    <div class="flex items-center gap-4">

      <!-- All -->
      <button (click)="typeofIssue('All')"  class="flex items-center gap-3 bg-slate-800 hover:bg-slate-700 transition px-5 py-2 rounded-xl text-white font-medium">

        <span>All</span>

        <span class="inline-flex items-center rounded-full bg-blue-400/10  px-3 py-1 text-sm text-blue-400 inset-ring inset-ring-red-400/20">
          {{all}}
        </span>
      </button>

      <!-- Open -->
      <button (click)="typeofIssue('open')"  class="flex items-center gap-3 bg-slate-800 hover:bg-slate-700 transition px-5 py-2 rounded-xl text-white font-medium">

        <span>Open</span>

        <span  class="inline-flex items-center rounded-full bg-green-400/10  px-3 py-1 text-sm text-green-600 inset-ring inset-ring-red-400/20">
          {{open}}
        </span>
      </button>

      <!-- Closed -->
      <button (click)="typeofIssue('closed')" class="flex items-center gap-3 bg-slate-800 hover:bg-slate-700 transition px-5 py-2 rounded-xl text-white font-medium">

        <span>Closed</span>

        <span class=" inline-flex items-center rounded-full bg-red-400/10 px-3 py-1 text-sm text-red-600 inset-ring inset-ring-red-400/20">
          {{close}}
        </span>
      </button>

    </div>

    <!-- Right Side -->
    <div class="flex items-center gap-4">

     

      <!-- Total Issues -->
      <div class="bg-slate-900 border border-slate-700 text-white px-5 py-2 rounded-xl font-medium">

        Total Issues:    {{all}}

      </div>

    </div>

  </div>
</div>
